<svg width="512" height="512" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Google Business Profile Optimization Icon</title>
  <desc>A browser window outline with horizontal content lines and a clock badge in the bottom right corner</desc>

  <style>
    .ico { fill: none; stroke: #ffffff; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
    .ico-fill { fill: #ffffff; stroke: none; }
    .clock-bg { fill: transparent; }
  </style>

  <rect x="120" y="140" width="440" height="340" rx="24" class="ico"/>
  <line x1="120" y1="220" x2="560" y2="220" class="ico"/>
  <circle cx="163" cy="180" r="12" class="ico"/>
  <circle cx="210" cy="180" r="12" class="ico"/>
  <circle cx="257" cy="180" r="12" class="ico"/>
  <line x1="160" y1="285" x2="490" y2="285" class="ico"/>
  <line x1="160" y1="335" x2="430" y2="335" class="ico"/>
  <line x1="160" y1="385" x2="390" y2="385" class="ico"/>
  <circle cx="490" cy="430" r="72" class="clock-bg"/>
  <circle cx="490" cy="430" r="72" class="ico"/>
  <line x1="490" y1="400" x2="490" y2="432" class="ico" stroke-width="16"/>
  <line x1="490" y1="432" x2="516" y2="450" class="ico" stroke-width="16"/>
  <circle cx="490" cy="430" r="8" class="ico-fill"/>
</svg>
